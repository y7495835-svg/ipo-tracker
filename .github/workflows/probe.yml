name: 1-데이터소스-접속테스트
 
on:
  workflow_dispatch:
 
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 접속 테스트 실행
        run: python probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: probe-result
          path: probe_result.json
 
