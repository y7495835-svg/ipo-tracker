name: 2-사이트-자동갱신

on:
  schedule:
    - cron: "40 20 * * 0-4"    # 평일 아침 05:40 KST (= 전날 20:40 UTC, 일~목) → 06:00 전후 반영
    - cron: "40 10 * * 1-5"    # 평일 저녁 19:40 KST (= 10:40 UTC) → 20:00 전후 반영
    # GitHub 예약 실행은 10~30분 늦게 돌 수 있어 목표 시각보다 20분 일찍 잡음
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install requests beautifulsoup4 lxml
      - name: 데이터 수집 + 사이트 생성
        run: python collect.py
      - name: 캐시·원자료 저장
        run: |
          git config user.name "ipo-bot"
          git config user.email "ipo-bot@users.noreply.github.com"
          git add data/
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')" || echo "변경 없음"
          git pull --rebase --autostash || true
          git push || echo "캐시 저장 실패(사이트 배포는 계속 진행)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
